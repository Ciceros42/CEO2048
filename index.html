<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Granite CEO 2048</title>
<style>
:root{--bg:#f4f1ea;--ink:#2b2a27;--muted:#6b675f;--board:#a8a29a;--cell:#c9c3ba;--accent:#3d5a80;--slide:140ms}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 16px;min-height:100vh}
h1{font-size:clamp(28px,7vw,48px);margin:0 0 12px;letter-spacing:-.5px;text-align:center}
.bar{width:min(480px,100%);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.scores{display:flex;gap:8px}
.box{background:var(--board);color:#fff;border-radius:8px;padding:6px 14px;text-align:center;min-width:72px}
.box small{display:block;font-size:11px;text-transform:uppercase;opacity:.85}
.box b{font-size:20px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer}
.wrap{position:relative;width:min(480px,100%);aspect-ratio:1;touch-action:none}
#board{position:absolute;inset:0;background:var(--board);border-radius:12px;padding:3%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:3%}
.cell{background:var(--cell);border-radius:8px}
#tiles{position:absolute;inset:0}
/* cell = 21.25% of board, step = 24.25% of board = 114.1176% of a tile */
.tile{position:absolute;left:3%;top:3%;width:21.25%;height:21.25%;
 transform:translate(calc(var(--c)*114.1176%),calc(var(--r)*114.1176%));
 transition:transform var(--slide) cubic-bezier(.3,1.35,.55,1);will-change:transform}
.tile.gone{z-index:0}.tile{z-index:1}
.inner{width:100%;height:100%;border-radius:8px;background-size:cover;background-position:center 25%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5),0 2px 6px rgba(0,0,0,.15);position:relative}
.inner span{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-weight:700;font-size:clamp(10px,2.6vw,14px);padding:1px 6px;border-radius:6px}
.pop .inner{animation:pop 220ms cubic-bezier(.3,1.5,.6,1) both}
.bump .inner{animation:bump 240ms cubic-bezier(.3,1.4,.6,1)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.14)}75%{transform:scale(.97)}100%{transform:scale(1)}}
#overlay{position:absolute;inset:0;border-radius:12px;background:rgba(244,241,234,.8);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:30px;font-weight:700;z-index:5;animation:fade .3s}
#overlay.show{display:flex}
@keyframes fade{from{opacity:0}}
.legend{width:min(480px,100%);margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.legend div{text-align:center;font-size:12px;color:var(--muted)}
.legend img{width:100%;aspect-ratio:1;object-fit:cover;object-position:center 25%;border-radius:6px;display:block;margin-bottom:2px}
p.help{color:var(--muted);font-size:14px;margin:12px 0 0;text-align:center}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.pop .inner,.bump .inner{animation:none}}
</style></head><body>
<h1>Granite CEO 2048</h1>

const N=4,SLIDE=140;
const tilesEl=document.getElementById("tiles"),boardEl=document.getElementById("board"),overlay=document.getElementById("overlay");
for(let i=0;i<16;i++){const c=document.createElement("div");c.className="cell";boardEl.appendChild(c)}
let grid,score,best=0,won=false,keepGoing=false,busy=false,queued=null;
try{best=+localStorage.getItem("gceo2048best")||0}catch(e){}
function img(v){return IMGS[Math.min(Math.log2(v)-1,IMGS.length-1)]}
function makeTile(v,r,c,cls){const el=document.createElement("div");el.className="tile"+(cls?" "+cls:"");
 el.innerHTML='<div class="inner"><span></span></div>';const t={v,r,c,el};setVal(t,v);place(t);tilesEl.appendChild(el);return t}
function setVal(t,v){t.v=v;const i=t.el.firstChild;i.style.backgroundImage="url("+img(v)+")";i.firstChild.textContent=v}
function place(t){t.el.style.setProperty("--r",t.r);t.el.style.setProperty("--c",t.c)}
function retrigger(t,cls){t.el.classList.remove("pop","bump");void t.el.offsetWidth;t.el.classList.add(cls)}
function empties(){const e=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])e.push([r,c]);return e}
function spawn(){const e=empties();if(!e.length)return;const[r,c]=e[Math.random()*e.length|0];grid[r][c]=makeTile(Math.random()<.9?2:4,r,c,"pop")}
function updScore(){document.getElementById("score").textContent=score;
 if(score>best){best=score;try{localStorage.setItem("gceo2048best",best)}catch(e){}}document.getElementById("best").textContent=best}
function start(){tilesEl.innerHTML="";grid=Array.from({length:N},()=>Array(N).fill(null));score=0;won=false;keepGoing=false;busy=false;queued=null;
 overlay.classList.remove("show");spawn();spawn();updScore()}
function move(dir){ // 0 left 1 right 2 up 3 down
 if(overlay.classList.contains("show"))return;
 if(busy){queued=dir;return}
 const next=Array.from({length:N},()=>Array(N).fill(null)),merges=[],removed=[];let moved=false;
 for(let k=0;k<N;k++){
  let pos=[];for(let j=0;j<N;j++)pos.push(dir<2?[k,j]:[j,k]);if(dir===1||dir===3)pos.reverse();
  const line=pos.map(([r,c])=>grid[r][c]).filter(Boolean);let w=0;
  for(let i=0;i<line.length;i++){const t=line[i],[r,c]=pos[w];
   if(line[i+1]&&line[i+1].v===t.v){const o=line[i+1];
    for(const x of[t,o]){if(x.r!==r||x.c!==c)moved=true;x.r=r;x.c=c;place(x)}
    o.el.classList.add("gone");removed.push(o);merges.push(t);next[r][c]=t;i++}
   else{if(t.r!==r||t.c!==c)moved=true;t.r=r;t.c=c;place(t);next[r][c]=t}
   w++}}
 if(!moved)return;
 grid=next;busy=true;
 setTimeout(()=>{removed.forEach(o=>o.el.remove());
  merges.forEach(t=>{setVal(t,t.v*2);score+=t.v;retrigger(t,"bump")});
  updScore();spawn();busy=false;check();
  if(queued!==null){const q=queued;queued=null;move(q)}},SLIDE);
}
function canMove(){if(empties().length)return true;
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=grid[r][c].v;if((c<N-1&&grid[r][c+1].v===v)||(r<N-1&&grid[r+1][c].v===v))return true}return false}
function over(t,b){document.getElementById("msg").textContent=t;document.getElementById("againBtn").textContent=b;overlay.classList.add("show")}
function check(){if(!won&&grid.flat().some(t=>t&&t.v>=2048)){won=true;over("You win!","Keep going");return}if(!canMove())over("Game over","Play again")}
document.getElementById("newBtn").onclick=start;
document.getElementById("againBtn").onclick=()=>{if(won&&!keepGoing&&canMove()){keepGoing=true;overlay.classList.remove("show")}else start()};
const keys={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3,a:0,d:1,w:2,s:3,A:0,D:1,W:2,S:3};
document.addEventListener("keydown",e=>{if(e.key in keys){e.preventDefault();if(!e.repeat)move(keys[e.key])}});
const wrap=document.getElementById("wrap");let sx,sy;
wrap.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
wrap.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:0):(dy>0?3:2))});
start();
